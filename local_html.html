    <style type="text/css" data-vite-dev-id="D:/workspace/w2/src/app.css">
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
      /* ═══════════════════════════════════════════════════
   app.css — مهام اليوم
   Entry point: imports all feature and shared styles
═══════════════════════════════════════════════════ */
      /* ── Design tokens & themes ── */
      /* ═══════════════════════════════════════════════════
   tokens.css — Design Tokens & Time-Based Themes
   مهام اليوم — نظام الألوان والمتغيرات
═══════════════════════════════════════════════════ */
      /* ── Design Tokens (default: afternoon/dark) ── */
      :root {
        --gold: #c8a96e;
        --gold-light: #e8c980;
        --gold-rgb: 200, 169, 110;
        --text-gold: #fdf5e0;
        --bg-gradient: linear-gradient(160deg, #1a1209 0%, #2c1f0e 50%, #1a1209 100%);
        --bg-card: #231806;
        --bg-input: #1e1508;

        /* ── Typography ── */
        --font-sm: 11px;
        --font-base: 13px;
        --font-md: 15px;
        --font-lg: 18px;
        --font-xl: 24px;

        /* ── Spacing ── */
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 12px;
        --space-lg: 16px;
        --space-xl: 24px;

        /* ── Radii ── */
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-pill: 9999px;
      }
      /* ── Dynamic Time Themes ── */
      [data-theme='dawn'] {
        --gold: #dca7a5;
        --gold-light: #ebd1d0;
        --gold-rgb: 220, 167, 165;
        --text-gold: #ffffff;
        --bg-gradient: linear-gradient(160deg, #1f1315 0%, #331e22 50%, #1f1315 100%);
        --bg-card: #26171a;
        --bg-input: #1a0f12;
      }
      [data-theme='morning'] {
        --gold: #e6c27a;
        --gold-light: #f5dfaa;
        --gold-rgb: 230, 194, 122;
        --text-gold: #ffffff;
        --bg-gradient: linear-gradient(160deg, #1a1710 0%, #2c2514 50%, #1a1710 100%);
        --bg-card: #211d12;
        --bg-input: #17140b;
      }
      [data-theme='sunset'] {
        --gold: #cc7a52;
        --gold-light: #e69f7a;
        --gold-rgb: 204, 122, 82;
        --text-gold: #ffffff;
        --bg-gradient: linear-gradient(160deg, #1f100a 0%, #331a10 50%, #1f100a 100%);
        --bg-card: #26130c;
        --bg-input: #1a0d08;
      }
      [data-theme='night'] {
        --gold: #b39b71;
        --gold-light: #d9bd8c;
        --gold-rgb: 179, 155, 113;
        --text-gold: #ffffff;
        --bg-gradient: linear-gradient(160deg, #17100a 0%, #291c12 50%, #17100a 100%);
        --bg-card: #20150d;
        --bg-input: #17100a;
      }
      /* ── Night Shift Override (يتغلب على data-theme) ── */
      [data-shift='night'] {
        --gold: #7ca8d9 !important;
        --gold-light: #a6c8e8 !important;
        --gold-rgb: 124, 168, 217 !important;
        --text-gold: #ffffff !important;
        --bg-gradient: linear-gradient(160deg, #09121a 0%, #0e1f2c 50%, #09121a 100%) !important;
        --bg-card: #061826 !important;
        --bg-input: #05101a !important;
      }
      /* ── Global reset, focus & motion ── */
      /* ═══════════════════════════════════════════════════
   reset.css — Global Reset, Focus & Motion
   مهام اليوم
═══════════════════════════════════════════════════ */
      /* ── Reset & Base ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      /* ══════════════════════════════════════════════════
   ACCESSIBILITY — Focus Styles
   يظهر فقط عند التنقل بلوحة المفاتيح (لا يظهر بالماوس)
══════════════════════════════════════════════════ */
      :focus-visible {
        outline: 2px solid rgba(var(--gold-rgb), 0.75);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
      /* إزالة outline الافتراضي لمن يستخدم الماوس */
      :focus:not(:focus-visible) {
        outline: none;
      }
      /* focus للـ checkboxes الدائرية */
      .task-checkbox:focus-visible,
      .task-checkbox--small:focus-visible {
        outline: 2px solid rgba(var(--gold-rgb), 0.75);
        outline-offset: 3px;
        border-radius: var(--radius-pill);
      }
      /* focus لعناصر الـ Modal (icon grid) */
      .icon-grid__option:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
      /* focus للأزرار */
      .toggle-btn:focus-visible,
      .toggle-btn--list:focus-visible,
      .icon-btn:focus-visible,
      .btn-add-task:focus-visible,
      .btn-save:focus-visible,
      .btn-cancel:focus-visible {
        outline: 2px solid rgba(var(--gold-rgb), 0.75);
        outline-offset: 2px;
      }
      /* ══════════════════════════════════════════════════
   TOUCH DEVICES — إظهار sub-actions دائماً
   (لأن hover لا يعمل باللمس)
══════════════════════════════════════════════════ */
      @media (hover: none) {
        .sub-actions {
          opacity: 1 !important;
        }
      }
      /* ══════════════════════════════════════════════════
   REDUCED MOTION — احترام إعدادات المستخدم
══════════════════════════════════════════════════ */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      /* ── Shared UI primitives ── */
      /* ═══════════════════════════════════════════════════
   shared.css — Shared UI Primitives
   Used across tasks and finance features
═══════════════════════════════════════════════════ */
      /* ── Shared Keyframes ── */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes popUp {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      /* ── Sync Status Badge ── */
      .sync-badge {
        position: fixed;
        bottom: 72px; /* sits above tab bar (~56px) */
        inset-inline-start: 16px; /* right in RTL (Arabic), left in LTR */
        z-index: 50;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        font-size: var(--font-sm);
        padding: var(--space-xs) var(--space-md);
        border-radius: var(--radius-pill);
        white-space: nowrap;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }
      .sync-badge.syncing {
        color: #e6a855;
        background: rgba(230, 168, 85, 0.12);
        border: 1px solid rgba(230, 168, 85, 0.25);
      }
      .sync-badge.synced {
        color: #9bc87a;
        background: rgba(155, 200, 122, 0.1);
        border: 1px solid rgba(155, 200, 122, 0.22);
      }
      .sync-badge.offline {
        color: rgba(var(--gold-rgb), 0.6);
        background: rgba(var(--gold-rgb), 0.08);
        border: 1px solid rgba(var(--gold-rgb), 0.18);
      }
      .sync-badge.error {
        color: #d97e6a;
        background: rgba(217, 126, 106, 0.12);
        border: 1px solid rgba(217, 126, 106, 0.28);
      }
      /* ── Task Card ── */
      .task-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(var(--gold-rgb), 0.15);
        border-radius: var(--radius-lg);
        margin-bottom: var(--space-md);
        transition:
          border-color 0.3s,
          background 0.3s;
        overflow: hidden;
      }
      .task-card:hover {
        border-color: rgba(var(--gold-rgb), 0.28);
        background: rgba(255, 255, 255, 0.055);
      }
      .task-card.done {
        opacity: 0.46;
      }
      .task-card.warn {
        background: repeating-linear-gradient(
          45deg,
          rgba(217, 126, 106, 0.08),
          rgba(217, 126, 106, 0.08) 8px,
          transparent 8px,
          transparent 16px
        );
      }
      /* ── Pinned highlight (used in the dedicated pinned section) ── */
      .task-card--pinned {
        border-color: rgba(var(--gold-rgb), 0.45);
        border-right: 3px solid var(--gold);
        background: rgba(var(--gold-rgb), 0.06);
        box-shadow: 0 0 18px rgba(var(--gold-rgb), 0.07);
      }
      .task-card--pinned:hover {
        border-color: rgba(var(--gold-rgb), 0.65);
        background: rgba(var(--gold-rgb), 0.09);
      }
      /* ── Pinned Section ── */
      .tpg-pinned-section {
        margin-bottom: var(--space-xl);
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid rgba(var(--gold-rgb), 0.3);
        box-shadow: 0 0 24px rgba(var(--gold-rgb), 0.06);
      }
      .tpg-pinned-header {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        width: 100%;
        padding: var(--space-sm) var(--space-lg);
        background: rgba(var(--gold-rgb), 0.1);
        border: none;
        cursor: pointer;
        font-family: 'Amiri', serif;
        text-align: right;
        transition: background 0.2s;
      }
      .tpg-pinned-header:hover {
        background: rgba(var(--gold-rgb), 0.16);
      }
      .tpg-pinned-header__icon {
        font-size: var(--font-lg);
        line-height: 1;
      }
      .tpg-pinned-header__label {
        font-size: var(--font-base);
        font-weight: 700;
        color: var(--text-gold);
        flex: 1;
      }
      .tpg-pinned-header__count {
        background: rgba(var(--gold-rgb), 0.2);
        color: var(--gold);
        font-size: var(--font-sm);
        font-weight: 700;
        border-radius: var(--radius-pill);
        padding: 1px 8px;
        border: 1px solid rgba(var(--gold-rgb), 0.3);
      }
      .tpg-pinned-header__chevron {
        font-size: 10px;
        color: rgba(var(--gold-rgb), 0.5);
        transition: transform 0.25s ease;
        flex-shrink: 0;
      }
      .tpg-pinned-body {
        padding: var(--space-sm);
        animation: slideDown 0.22s ease;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      /* Cards inside pinned section: keep border-radius, no bottom border on last */
      .tpg-pinned-body .task-card {
        border-radius: var(--radius-md);
        margin-bottom: var(--space-sm);
      }
      .tpg-pinned-body .task-card:last-child {
        margin-bottom: 0;
      }
      /* ── Checkboxes ── */
      .task-checkbox {
        width: 26px;
        height: 26px;
        border-radius: var(--radius-pill);
        border: 2px solid;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.25s;
        background: transparent;
      }
      .task-checkbox:hover {
        transform: scale(1.1);
      }
      .task-checkbox.on {
        background: currentColor;
      }
      .task-checkbox--small {
        width: 18px;
        height: 18px;
        border-radius: var(--radius-pill);
        border: 2px solid rgba(var(--gold-rgb), 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.2s;
        background: transparent;
      }
      .task-checkbox--small.on {
        background: var(--gold);
        border-color: var(--gold);
      }
      /* ── Progress Bar ── */
      .progress-bar {
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: var(--radius-pill);
        overflow: hidden;
      }
      .progress-bar__fill {
        height: 100%;
        border-radius: var(--radius-pill);
        background: linear-gradient(90deg, var(--gold), var(--gold-light));
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* ── Badges ── */
      .task-badge {
        font-size: var(--font-sm);
        padding: var(--space-xs) var(--space-md);
        border-radius: var(--radius-pill);
        font-weight: bold;
      }
      /* ── Buttons ── */
      .icon-btn {
        border: none;
        border-radius: var(--radius-sm);
        padding: var(--space-xs) var(--space-md);
        cursor: pointer;
        font-family: 'Amiri', serif;
        font-size: var(--font-sm);
        transition: all 0.18s;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }
      /* Edit button */
      .icon-btn--edit {
        background: rgba(110, 159, 207, 0.1);
        color: rgba(110, 159, 207, 0.8);
        border: 1px solid rgba(110, 159, 207, 0.18);
      }
      .icon-btn--edit:hover {
        background: rgba(110, 159, 207, 0.2);
        color: #6e9fcf;
      }
      /* Delete button */
      .icon-btn--delete {
        background: rgba(217, 126, 106, 0.1);
        color: rgba(217, 126, 106, 0.7);
        border: 1px solid rgba(217, 126, 106, 0.18);
      }
      .icon-btn--delete:hover {
        background: rgba(217, 126, 106, 0.2);
        color: #d97e6a;
      }
      /* Brief/toggle buttons */
      .toggle-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(var(--gold-rgb), 0.2);
        border-radius: var(--radius-pill);
        color: rgba(var(--gold-rgb), 0.6);
        font-size: var(--font-sm);
        padding: var(--space-xs) var(--space-md);
        cursor: pointer;
        font-family: 'Amiri', serif;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }
      .toggle-btn:hover,
      .toggle-btn.on {
        background: rgba(var(--gold-rgb), 0.1);
        color: var(--gold);
        border-color: rgba(var(--gold-rgb), 0.4);
      }
      /* List/subtask toggle button */
      .toggle-btn--list {
        background: rgba(var(--gold-rgb), 0.07);
        border: 1px solid rgba(var(--gold-rgb), 0.2);
        border-radius: var(--radius-pill);
        color: rgba(var(--gold-rgb), 0.65);
        font-size: var(--font-sm);
        padding: var(--space-xs) var(--space-md);
        cursor: pointer;
        font-family: 'Amiri', serif;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }
      .toggle-btn--list:hover,
      .toggle-btn--list.on {
        background: rgba(var(--gold-rgb), 0.14);
        color: var(--gold);
        border-color: rgba(var(--gold-rgb), 0.4);
      }
      /* ── Panels (brief / subtask) ── */
      .expand-panel {
        border-top: 1px solid rgba(var(--gold-rgb), 0.1);
        padding: 12px 16px 14px;
        animation: slideDown 0.22s ease;
      }
      /* ── Brief items ── */
      .brief-item {
        display: flex;
        align-items: flex-start;
        gap: var(--space-sm);
        margin-bottom: var(--space-sm);
        font-size: var(--font-base);
        color: rgba(var(--gold-rgb), 0.72);
        line-height: 1.55;
      }
      .brief-item__dot {
        width: 6px;
        height: 6px;
        border-radius: var(--radius-pill);
        flex-shrink: 0;
        margin-top: var(--space-sm);
      }
      .brief-divider {
        width: 1px;
        background: rgba(var(--gold-rgb), 0.1);
        flex-shrink: 0;
        align-self: stretch;
      }
      /* ── Subtask List ── */
      .sub-row {
        display: flex;
        align-items: flex-start;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-md);
        transition: background 0.15s;
        position: relative;
      }
      .sub-row:hover {
        background: rgba(var(--gold-rgb), 0.06);
      }
      .sub-row:hover .sub-actions {
        opacity: 1 !important;
      }
      .sub-text {
        flex: 1;
        font-size: var(--font-base);
        color: rgba(var(--gold-rgb), 0.8);
        line-height: 1.4;
        cursor: default;
      }
      .sub-text.done {
        text-decoration: line-through;
        color: rgba(var(--gold-rgb), 0.38);
      }
      .sub-edit-inp {
        flex: 1;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(var(--gold-rgb), 0.35);
        border-radius: var(--radius-sm);
        padding: var(--space-xs) var(--space-sm);
        color: var(--text-gold);
        font-family: 'Amiri', serif;
        font-size: var(--font-base);
        outline: none;
      }
      .sub-actions {
        display: flex;
        gap: var(--space-xs);
        opacity: 0;
        transition: opacity 0.15s;
      }
      .add-sub-row {
        display: flex;
        gap: var(--space-sm);
        margin-top: var(--space-md);
        padding-top: var(--space-md);
        border-top: 1px dashed rgba(var(--gold-rgb), 0.15);
      }
      .add-sub-inp {
        flex: 1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(var(--gold-rgb), 0.2);
        border-radius: var(--radius-md);
        padding: var(--space-sm) var(--space-md);
        color: var(--text-gold);
        font-family: 'Amiri', serif;
        font-size: var(--font-base);
        outline: none;
        transition: border-color 0.2s;
      }
      .add-sub-inp:focus {
        border-color: rgba(var(--gold-rgb), 0.45);
      }
      .add-sub-inp::placeholder {
        color: rgba(var(--gold-rgb), 0.3);
      }
      .add-sub-btn {
        background: rgba(var(--gold-rgb), 0.15);
        border: 1px solid rgba(var(--gold-rgb), 0.3);
        border-radius: var(--radius-md);
        padding: var(--space-sm) var(--space-lg);
        color: var(--gold);
        font-family: 'Amiri', serif;
        font-size: var(--font-base);
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .add-sub-btn:hover {
        background: rgba(var(--gold-rgb), 0.25);
      }
      .sub-progress {
        font-size: var(--font-sm);
        color: rgba(var(--gold-rgb), 0.45);
        background: rgba(var(--gold-rgb), 0.08);
        border-radius: var(--radius-pill);
        padding: var(--space-xs) var(--space-sm);
      }
      /* ── Modal Overlay ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        z-index: 250;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-lg);
        animation: fadeIn 0.18s ease;
      }
      .modal-box {
        background: var(--bg-card);
        border: 1px solid rgba(var(--gold-rgb), 0.25);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 440px;
        max-height: 90vh;
        overflow-y: auto;
        padding: var(--space-xl) var(--space-xl);
        animation: popUp 0.2s ease;
      }
      /* ── Modal Form Elements ── */
      .form-label {
        display: block;
        font-size: var(--font-base);

      }
      .tpg-block--current .tpg-block__header {
        background: rgba(var(--gold-rgb), 0.12);
      }
      .tpg-block__icon {
        font-size: var(--font-lg);
        line-height: 1;
      }
      .tpg-block__label {
        font-size: var(--font-base);
        font-weight: 700;
        color: var(--text-gold);
        flex: 1;
      }
      .tpg-block__now-badge {
        font-size: var(--font-xs);
        font-weight: 700;
        color: var(--gold);
        background: rgba(var(--gold-rgb), 0.15);
        border-radius: var(--radius-pill);
        padding: 2px 10px;
        animation: badge-glow 2s ease-in-out infinite;
      }
      .tpg-block__optional {
        font-size: var(--font-xs);
        color: rgba(var(--gold-rgb), 0.5);
        background: rgba(var(--gold-rgb), 0.07);
        border-radius: var(--radius-pill);
        padding: 2px 8px;
      }
      .tpg-block__toggle {
        background: none;
        border: none;
        color: var(--gold);
        font-size: var(--font-sm);
        cursor: pointer;
        padding: var(--space-xs);
        line-height: 1;
        opacity: 0.7;
        transition: opacity 0.2s;
      }
      .tpg-block__toggle:hover {
        opacity: 1;
      }
      .tpg-block__add-btn {
        background: rgba(var(--gold-rgb), 0.15);
        border: 1px solid var(--gold);
        color: var(--gold);
        font-size: var(--font-base);
        font-weight: 700;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        margin-right: auto;
      }
      .tpg-block__add-btn:hover {
        background: rgba(var(--gold-rgb), 0.25);
        transform: scale(1.1);
      }
      .tpg-block__tasks {
        padding: var(--space-sm);
      }
      @keyframes badge-glow {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.65;
        }
      }
      /* Task cards inside a block: no outer margin/radius */
      .tpg-block .task-card {
        border-radius: 0;
        border-left: none;
        border-right: none;
        border-top: none;
        border-bottom: 1px solid rgba(var(--gold-rgb), 0.08);
        margin-bottom: 0;
      }
      .tpg-block .task-card:last-child {
        border-bottom: none;
      }
      /* Empty state */
      .tpg-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-md);
        font-size: var(--font-base);
        color: rgba(var(--gold-rgb), 0.45);
        text-align: center;
        padding: var(--space-xl) var(--space-lg);
        background: rgba(var(--gold-rgb), 0.02);
        border-radius: var(--radius-lg);
        border: 1px dashed rgba(var(--gold-rgb), 0.15);
        margin-top: var(--space-xl);
      }
      .tpg-empty span {
        font-size: 2.5rem;
      }
      .tpg-empty p {
        margin: 0;
      }
      /* ── Feature: Calendar ── */
      /* ═══════════════════════════════════════════════════
   calendar.css — Calendar feature styles
   All .cal-* component styles live here.
═══════════════════════════════════════════════════ */
      /* ── Calendar View Shell ── */
      .cal-view {
        max-width: 480px;
        margin: 0 auto;
        padding: var(--space-lg);
      }
      .cal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-md);
      }
      .cal-title {
        font-size: var(--font-lg);
        font-weight: 700;
        color: var(--text-gold);
      }
      .cal-nav {
        background: none;
        border: 1px solid rgba(var(--gold-rgb), 0.3);
        color: var(--gold);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .cal-nav:hover {
        background: rgba(var(--gold-rgb), 0.1);
      }
      .cal-today-btn {
        width: 100%;
        margin-bottom: var(--space-md);
        padding: var(--space-sm);
        background: rgba(var(--gold-rgb), 0.1);
        border: 1px solid rgba(var(--gold-rgb), 0.3);
        color: var(--gold);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .cal-days-header {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        margin-bottom: var(--space-sm);
      }
      .cal-day-name {
        text-align: center;
        font-size: var(--font-xs);
        color: rgba(var(--gold-rgb), 0.5);
        padding: var(--space-xs) 0;
      }
      /* ── Calendar Grid ── */
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        margin-bottom: var(--space-lg);
      }
      .cal-cell {
        position: relative;
        aspect-ratio: 1;
        background: rgba(var(--gold-rgb), 0.03);
        border-radius: var(--radius-sm);
        padding: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .cal-cell--empty {
        background: transparent;
      }
      .cal-cell--today {
        background: rgba(var(--gold-rgb), 0.15);
        border: 1px solid var(--gold);
      }
      .cal-cell--has-tasks {
        background: rgba(var(--gold-rgb), 0.08);
      }
      .cal-day-num {
        font-size: var(--font-xs);
        color: rgba(var(--gold-rgb), 0.7);
        font-weight: 600;
      }
      .cal-tasks {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 2px;
      }
      .cal-task-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .cal-more {
        font-size: 8px;
        color: rgba(var(--gold-rgb), 0.5);
      }
      /* ── Shift-type cell modifiers ──────────────────────────────────────── */
      /* Morning shift — warm amber */
      .cal-cell--morning .cal-day-num {
        font-weight: 700;
      }
      .cal-cell--morning:hover {
        border-top-color: rgba(251, 191, 36, 1) !important;
      }
      /* Evening shift — cool violet */
      .cal-cell--evening .cal-day-num {
        font-weight: 700;
      }
      .cal-cell--evening:hover {
        border-top-color: rgba(167, 139, 250, 1) !important;
      }
      /* Off day — muted, hatched */
      .cal-cell--off {
        border-radius: var(--radius-sm);
      }
      .cal-cell--off .cal-day-num {
        font-weight: 400;
      }
      /* ── Shift Legend ────────────────────────────────────────────────────── */
      .cal-shift-legend {
        display: flex;
        justify-content: center;
        gap: var(--space-md);
        margin-bottom: var(--space-lg);
        flex-wrap: wrap;
      }
      .cal-shift-legend__item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--font-xs);
        font-weight: 600;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        border-top: 3px solid transparent;
        letter-spacing: 0.02em;
      }
      .cal-shift-legend__item--morning {
        color: rgba(251, 191, 36, 0.9);
        background: rgba(251, 191, 36, 0.08);
        border-top-color: rgba(251, 191, 36, 0.75);
      }
      .cal-shift-legend__item--evening {
        color: rgba(167, 139, 250, 0.9);
        background: rgba(139, 92, 246, 0.1);
        border-top-color: rgba(167, 139, 250, 0.72);
      }
      .cal-shift-legend__item--off {
        color: rgba(100, 116, 139, 0.85);
        background: repeating-linear-gradient(
          -45deg,
          rgba(100, 116, 139, 0.07) 0px,
          rgba(100, 116, 139, 0.07) 4px,
          transparent 4px,
          transparent 9px
        );
        border-top: 2px dashed rgba(100, 116, 139, 0.45);
        opacity: 0.85;
      }
      /* ── Selected Day Panel ── */
      .cal-selected-tasks {
        background: rgba(var(--gold-rgb), 0.03);
        border-radius: var(--radius-md);
        padding: var(--space-md);
      }
      .cal-selected-title {
        margin: 0 0 var(--space-md);
        font-size: var(--font-base);
        color: var(--text-gold);
      }
      .cal-date-group {
        margin-bottom: var(--space-md);
      }
      .cal-date-label {
        font-size: var(--font-sm);
        color: var(--gold);
        margin-bottom: var(--space-xs);
        font-weight: 600;
      }
      .cal-date-tasks {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }
      .cal-task-item {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        font-size: var(--font-sm);
        color: rgba(var(--gold-rgb), 0.7);
        padding: var(--space-xs);
        background: rgba(var(--gold-rgb), 0.03);
        border-radius: var(--radius-sm);
      }
      .cal-empty {
        text-align: center;
        color: rgba(var(--gold-rgb), 0.4);
        font-size: var(--font-sm);
      }
      /* ── Battery indicator on calendar cells ── */
      .cal-cell--has-snapshot {
        border: 1px solid rgba(var(--gold-rgb), 0.18);
      }
      .cal-battery {
        display: flex;
        gap: 1px;
        margin-top: 2px;
        align-items: center;
        justify-content: center;
      }
      .cal-battery__seg {
        width: 5px;
        height: 4px;
        border-radius: 1px;
        background: rgba(var(--gold-rgb), 0.12);
        border: 1px solid rgba(var(--gold-rgb), 0.2);
        display: inline-block;
        transition: background 0.2s;
      }
      .cal-battery__seg--on {
        border-color: transparent;
      }
      /* ── History Panel ── */
      .cal-history {
        margin-top: var(--space-xl);
        background: rgba(var(--gold-rgb), 0.03);
        border: 1px solid rgba(var(--gold-rgb), 0.12);
        border-radius: var(--radius-lg);
        overflow: hidden;
        animation: slideDown 0.22s ease;
      }
      .cal-history__header {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-lg);
        background: rgba(var(--gold-rgb), 0.07);
        border-bottom: 1px solid rgba(var(--gold-rgb), 0.1);
      }
      .cal-history__icon {
        font-size: var(--font-lg);
      }
      .cal-history__title {
        font-size: var(--font-base);
        font-weight: 700;
        color: var(--text-gold);
        flex: 1;
      }
      .cal-history__badge {
        background: rgba(var(--gold-rgb), 0.18);
        color: var(--gold);
        font-size: var(--font-sm);
        font-weight: 700;
        padding: 1px 8px;
        border-radius: var(--radius-pill);
        border: 1px solid rgba(var(--gold-rgb), 0.3);
      }
      .cal-history__loading,
      .cal-history__empty {
        padding: var(--space-lg);
        color: rgba(var(--gold-rgb), 0.45);
        font-size: var(--font-sm);
        text-align: center;
      }
      .cal-history__summary {
        padding: var(--space-md) var(--space-lg) var(--space-sm);
      }
      .cal-history__prog-row {
        display: flex;
        justify-content: space-between;
        font-size: var(--font-sm);
        color: rgba(var(--gold-rgb), 0.6);
        margin-bottom: var(--space-xs);
      }
      .cal-history__prog-pct {
        font-weight: 700;
        color: var(--text-gold);
      }
      .cal-history__prog-track {
        height: 6px;
        background: rgba(var(--gold-rgb), 0.1);
        border-radius: var(--radius-pill);
        overflow: hidden;
      }
      .cal-history__prog-fill {
        height: 100%;
        border-radius: var(--radius-pill);
        transition: width 0.6s ease;
      }
      .cal-history__tasks {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: var(--space-xs) var(--space-sm) var(--space-md);
      }
      .cal-history__task {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-sm);
        background: rgba(var(--gold-rgb), 0.03);
        transition: background 0.15s;
      }
      .cal-history__task--done {
        opacity: 0.55;
      }
      .cal-history__task--done .cal-history__task-title {
        text-decoration: line-through;
      }
      .cal-history__task--skipped {
        opacity: 0.35;
      }
      .cal-history__task-state {
        font-size: 13px;
        flex-shrink: 0;
        width: 18px;
        text-align: center;
      }
      .cal-history__task-icon {
        font-size: var(--font-base);
        flex-shrink: 0;
      }
      .cal-history__task-title {
        font-size: var(--font-sm);
        color: var(--text-gold);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cal-history__task-cat {
        font-size: var(--font-xs);
        flex-shrink: 0;
        opacity: 0.8;
      }
      /* ── Calendar Search Bar ── */
      .cal-search-bar {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(var(--gold-rgb), 0.2);
        border-radius: var(--radius-md);
        padding: var(--space-sm) var(--space-md);
        margin-bottom: var(--space-md);
        transition: border-color 0.2s;
      }
      .cal-search-bar:focus-within {
        border-color: rgba(var(--gold-rgb), 0.5);
      }
      .cal-search-icon {
        font-size: var(--font-base);
        flex-shrink: 0;
        opacity: 0.6;
      }
      .cal-search-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-gold);
        font-family: 'Amiri', serif;
        font-size: var(--font-base);
      }
      .cal-search-input::placeholder {
        color: rgba(var(--gold-rgb), 0.35);
      }
      .cal-search-clear {
        background: none;
        border: none;
        color: rgba(var(--gold-rgb), 0.5);
        cursor: pointer;
        font-size: var(--font-sm);
        padding: 0 2px;
        line-height: 1;
        transition: color 0.15s;
      }
      .cal-search-clear:hover {
        color: var(--gold);
      }
      /* ── Search Results ── */
      .cal-search-results {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        animation: slideDown 0.2s ease;
      }
      .cal-search-result-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: var(--space-md);
        background: rgba(var(--gold-rgb), 0.05);
        border: 1px solid rgba(var(--gold-rgb), 0.15);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .cal-search-result-item:hover {
        background: rgba(var(--gold-rgb), 0.1);
        border-color: rgba(var(--gold-rgb), 0.35);
      }
      .cal-search-result-date {
        font-size: var(--font-sm);
        color: var(--gold);
        font-weight: 700;
      }
      .cal-search-result-snippet {
        font-size: var(--font-sm);
        color: rgba(var(--gold-rgb), 0.65);
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* ── Notes Panel ── */
      .cal-notes-panel {
        margin-top: var(--space-xl);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }
      .cal-notes-header {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        font-size: var(--font-base);
        font-weight: 700;
        color: var(--text-gold);
      }
      .cal-notes-count {
        background: rgba(var(--gold-rgb), 0.15);
        color: var(--gold);
        font-size: var(--font-sm);
        border-radius: var(--radius-pill);
        padding: 1px 8px;
        font-weight: 700;
      }
      .cal-notes-add-btn {
        margin-right: auto;
        background: rgba(var(--gold-rgb), 0.12);
        border: 1px solid rgba(var(--gold-rgb), 0.3);
        border-radius: var(--radius-pill);
        color: var(--gold);
        font-family: 'Amiri', serif;
        font-size: var(--font-sm);
        padding: var(--space-xs) var(--space-md);
        cursor: pointer;
        transition: all 0.2s;
      }
      .cal-notes-add-btn:hover {
        background: rgba(var(--gold-rgb), 0.22);
        border-color: rgba(var(--gold-rgb), 0.55);
      }
      .cal-notes-empty {
        font-size: var(--font-sm);
        color: rgba(var(--gold-rgb), 0.4);
        text-align: center;
        padding: var(--space-md);
      }
      /* ── Note Card ── */
      .cal-note-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(var(--gold-rgb), 0.15);
        border-radius: var(--radius-md);
        padding: var(--space-md);
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        transition: border-color 0.2s;
        animation: slideDown 0.18s ease;
      }
      .cal-note-card:hover {
        border-color: rgba(var(--gold-rgb), 0.3);
      }
      .cal-note-card--pinned {
        border-color: rgba(var(--gold-rgb), 0.4);
        background: rgba(var(--gold-rgb), 0.06);
      }
      .cal-note-actions {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }
      .cal-note-meta {
        font-size: var(--font-xs);
        color: rgba(var(--gold-rgb), 0.4);
      }
      .cal-note-pin-badge {
        font-size: var(--font-xs);
        color: rgba(var(--gold-rgb), 0.6);
        background: rgba(var(--gold-rgb), 0.1);
        border-radius: var(--radius-pill);
        padding: 1px 6px;
      }
      .cal-note-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 4px;
        border-radius: var(--radius-sm);
        opacity: 0.5;
        transition:
          opacity 0.15s,
          background 0.15s;
        line-height: 1;
      }
      .cal-note-btn:hover {
        opacity: 1;
        background: rgba(var(--gold-rgb), 0.1);
      }
      .cal-note-btn--delete:hover {
        background: rgba(217, 126, 106, 0.15);
      }
      /* ── Note Markdown Toolbar ── */
      .cal-note-toolbar {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .cal-note-toolbar button {
        background: rgba(var(--gold-rgb), 0.08);
        border: 1px solid rgba(var(--gold-rgb), 0.2);
        border-radius: var(--radius-sm);
        color: rgba(var(--gold-rgb), 0.75);
        font-family: monospace;
        font-size: 12px;
        padding: 2px 8px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .cal-note-toolbar button:hover {
        background: rgba(var(--gold-rgb), 0.18);
        color: var(--gold);
        border-color: rgba(var(--gold-rgb), 0.4);
      }
      /* ── Edit Textarea ── */
      .cal-note-edit-area {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(var(--gold-rgb), 0.25);
        border-radius: var(--radius-sm);
        padding: var(--space-sm) var(--space-md);
        color: var(--text-gold);
        font-family: 'Amiri', serif;
        font-size: var(--font-base);
        outline: none;
        resize: vertical;
        min-height: 90px;
        line-height: 1.55;
        transition: border-color 0.2s;
        box-sizing: border-box;
      }
      .cal-note-edit-area:focus {
        border-color: rgba(var(--gold-rgb), 0.5);
      }
      .cal-note-edit-area::placeholder {
        color: rgba(var(--gold-rgb), 0.3);
      }
      /* ── Character count ── */
      .cal-note-char-count {
        font-size: var(--font-xs);
        color: rgba(var(--gold-rgb), 0.4);
      }
      .cal-note-char-count.over {
        color: #d97e6a;
        font-weight: 700;
      }
      /* ── Save/Cancel action buttons ── */
      .cal-note-action-btn {
        padding: var(--space-xs) var(--space-md);
        border-radius: var(--radius-sm);
        font-family: 'Amiri', serif;
        font-size: var(--font-sm);
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid rgba(var(--gold-rgb), 0.25);
        background: transparent;
        color: rgba(var(--gold-rgb), 0.7);
      }
      .cal-note-action-btn:hover {
        border-color: rgba(var(--gold-rgb), 0.5);
        color: var(--gold);
      }
      .cal-note-action-btn--save {
        background: rgba(var(--gold-rgb), 0.15);
        border-color: rgba(var(--gold-rgb), 0.35);
        color: var(--gold);
      }
      .cal-note-action-btn--save:hover:not(:disabled) {
        background: rgba(var(--gold-rgb), 0.25);
      }
      .cal-note-action-btn--save:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      /* ── Rendered Markdown body ── */
      .cal-note-body {
        font-size: var(--font-base);
        color: rgba(var(--gold-rgb), 0.85);
        line-height: 1.65;
        word-break: break-word;
        cursor: default;
      }
      .cal-note-body p {
        margin: 0 0 var(--space-sm);
      }
      .cal-note-body p:last-child {
        margin-bottom: 0;
      }
      .cal-note-body strong {
        color: var(--text-gold);
        font-weight: 700;
      }
      .cal-note-body em {
        color: rgba(var(--gold-rgb), 0.75);
        font-style: italic;
      }
      .cal-note-body code {
        font-family: monospace;
        background: rgba(var(--gold-rgb), 0.1);
        border: 1px solid rgba(var(--gold-rgb), 0.2);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.88em;
        color: var(--gold-light);
      }
      .cal-note-body ul,
      .cal-note-body ol {
        padding-right: var(--space-xl);
        margin: 0 0 var(--space-sm);
      }
      .cal-note-body li {
